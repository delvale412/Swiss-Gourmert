version: '3.8'
services:
  web:
    build: .
    container_name: swiss_gourmet_site
    ports:
      - "8000:80"
    volumes:
      - ./app:/code/app  # Hot-reload: altera código local, reflete no container
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 80 --reload